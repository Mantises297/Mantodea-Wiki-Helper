<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>Mantodea Wiki Helper</title>
</head>
<body>

    <h1>Mantodea Wiki Helper</h1>
    <p style="margin-top: -10px; margin-bottom: 20px; color: #555;">
    Converts iNaturalist image and user info into a caption outputs, which can then be added to the Mantodea Wiki as image captions that display the right licenses.
    </p>

    <p><label>Subject Description:<br>
    <input type="text" id="subject" size="50"></label></p>

    <p><label>iNaturalist Observation Link:<br>
    <input type="text" id="obsLink" size="50"></label></p>

    <p><label>iNaturalist User Link:<br>
    <input type="text" id="userLink" size="50"></label></p>

    <p><label>Username:<br>
    <input type="text" id="username" size="50"></label></p>

    <p><label>User Full Name:<br>
    <input type="text" id="fullName" size="50"></label></p>

    <p><label>License / Copyright:<br>
    <input type="text" id="license" size="50"></label></p>

    <button onclick="generateText()">Generate Markup</button>

    <hr>

    <h3>Image Description Output:</h3>
    <textarea id="descOutput" rows="6" cols="70" readonly></textarea><br>
    <button onclick="copyDesc()">Copy Description</button>

    <h3>Caption Output:</h3>
    <textarea id="captionOutput" rows="3" cols="70" readonly></textarea><br>
    <button onclick="copyCaption()">Copy Caption</button>

    <script>
        function generateText() {
            const subject = document.getElementById('subject').value;
            const obsLink = document.getElementById('obsLink').value;
            const userLink = document.getElementById('userLink').value;
            const username = document.getElementById('username').value;
            const fullName = document.getElementById('fullName').value;
            const license = document.getElementById('license').value;

            const description = `${subject}, taken by [${userLink} ${fullName}] (iNaturalist user [${userLink} ${username}]) - [${obsLink} iNaturalist]\n\n${license}`;
            const caption = `(taken by [${userLink} ${fullName}] on [${obsLink} iNaturalist])`;

            document.getElementById('descOutput').value = description;
            document.getElementById('captionOutput').value = caption;
        }

        function copyDesc() {
            const descText = document.getElementById('descOutput');
            descText.select();
            document.execCommand('copy');
            alert('Description copied to clipboard!');
        }

        function copyCaption() {
            const captionText = document.getElementById('captionOutput');
            captionText.select();
            document.execCommand('copy');
            alert('Caption copied to clipboard!');
        }
    </script>

</body>
</html>
